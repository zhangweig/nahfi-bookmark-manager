name: Build and release extension
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run package
      - name: Check tag matches version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Nahfi Bookmark Manager $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          gh release upload "$GITHUB_REF_NAME" nahfi-bookmark-manager.zip --clobber
